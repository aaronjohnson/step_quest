name: step_quest
description: Turn your steps into an adventure!
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Persistence
  shared_preferences: ^2.2.2

  # State management
  flutter_riverpod: ^2.4.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0

  # Localization
  flutter_localizations:
    sdk: flutter

  # Wear OS support
  wear_plus: ^1.2.4
  health: ^13.2.1
  url_launcher: ^6.3.2
  pedometer_2: ^5.0.4
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon_1024.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icons/icon_1024.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
