name: step_quest
description: Turn your steps into an adventure!
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Persistence
  shared_preferences: ^2.2.2

  # State management
  flutter_riverpod: ^2.4.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.18.1
  collection: ^1.18.0

  # Wear OS support
  wear_plus: ^1.2.4
  health: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
